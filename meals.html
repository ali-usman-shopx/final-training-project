<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Final Training Project</title>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="./assets/stylesheets/css/primary.css">

    <!-- Custom Scripts -->
    <script type="module" src="./assets/scripts/primary.js"></script>
</head>

<body class="page">
    <!-- Breadcrumb Navigation -->
    <nav aria-label="breadcrumb" class="page-breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item" aria-current="page">
                <a href="index.html">Plans</a>
            </li>

            <li class="breadcrumb-item">
                <a href="day.html">Day</a>
            </li>

            <li class="breadcrumb-item current">
                Meals
            </li>

            <li class="breadcrumb-item">
                <a href="checkout.html">Checkout</a>
            </li>
        </ol>
    </nav>

    <!-- Page Content -->
    <main class="meals_page_container">
        <div id="meals_section_container">

        </div>
        <div id="cart_section_container">
            <div class="drawer_toggle_wrapper">
                <button id="cart_drawer_toggle" type="button" aria-label="Close cart">
                    <!-- SVG generated by JavaScript -->
                </button>
            </div>
            <div class="header">
                <span class="delivery_info">
                    My delivery for: <span id="date">DUMMY DATE</span>
                </span>
                <span id="clear_all">
                    Clear all
                </span>
            </div>
            <div class="body">
                <div id="cart_cards_container"></div>
                <div id="order_summary" class="inactive">
                    <div class="title">Order Summary</div>
                    <div class="meals_info">
                        <span id="count">3 Meals</span>
                        <span id="amount">0</span>
                    </div>
                    <div class="total">
                        <span>Subtotal</span>
                        <span id="subtotal">0</span>
                    </div>
                    <div class="tax_info">Tax and shipping calculated at checkout</div>
                </div>
            </div>
            <div class="footer">
                <div id="cart_row">
                    <span>
                        Subtotal
                        <span id="subtotal">0</span>
                    </span>
                    <span id="cart_pill">
                        <img id="cart_icon" src="./assets/images/icons/cart.svg" />
                        <span id="cart_count">0</span>
                    </span>
                </div>
                <button id="next_button">Next</button>
                <div id="instruction_text">
                    <span id="instruction">Please add</span>
                    <span id="over_under_amount">n more</span>
                    <span id="remaining_text">meals.</span>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
